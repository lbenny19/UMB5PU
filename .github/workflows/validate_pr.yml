name: Pre-Receive Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-push:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required so 'git diff' can see both branches
          
      - name: Format Pull request title
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_COMMIT_SHA=$(git log origin/${{ github.head_ref }} -1 --format=%H)
          echo "Last commit SHA found: $LAST_COMMIT_SHA"

          EXPECTED_TITLE=$(git log -1 --format=%s $LAST_COMMIT_SHA)
          EXPECTED_BODY=$(git log -1 --format=%b $LAST_COMMIT_SHA)

          echo "Overwriting PR fields to match: '$EXPECTED_TITLE'"

          if [ -z "$EXPECTED_BODY" ]; then
            gh pr edit ${{ github.event.pull_request.number }} --title "$EXPECTED_TITLE"
          else
            gh pr edit ${{ github.event.pull_request.number }} --title "$EXPECTED_TITLE" --body "$EXPECTED_BODY"
          fi

      - name: Extract CC Number from Commit Message
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B ${{ github.event.pull_request.head.sha }})
          echo "COMMIT_MSG: $COMMIT_MSG"
          CC_NO=$(echo "$COMMIT_MSG" | cut -c2-11 | sed 's/^0*//' | tr -d ' ')
          echo "CC_NO: $CC_NO"
          if ! echo "$CC_NO" | grep -qE '^[0-9]+$'; then
             echo "Error: The commit message must start with a numeric CC Number."
             echo "Found: $COMMIT_MSG"
             exit 1
          fi
          
          echo "CC_NUMBER=$CC_NO" >> $GITHUB_ENV

      - name: Run Validation Script
        shell: bash
        env:
          MF_PASSWORD: ${{ secrets.ZOSMF_PASSWORD }}
        run: |
          chmod +x ./hooks/validate_pr.sh ./hooks/owner_check
          ./hooks/validate_pr.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ env.CC_NUMBER }}		  
